# Backup scheduler for the daily Teams reports. The main timer (cron-job.org) asks for each
# report at 10:05, 15:05 and 18:05 South African time. GitHub tries at 10, 20 and 30
# minutes past, in case the timer missed; the app sends each report only once per day,
# so these calls are ignored when the report has already gone out.
# Times are UTC: 08:xx = 10:xx, 13:xx = 15:xx, 16:xx = 18:xx South African time.
name: Teams reports

on:
  schedule:
    - cron: "10,20,30 8 * * 1-5"
    - cron: "10,20,30 13 * * 1-5"
    - cron: "10,20,30 16 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which report (only sent within two hours of its time, once per day)"
        required: true
        default: "10"
        type: choice
        options: ["10", "15", "18"]

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the app to post the report
        env:
          APP_URL: ${{ vars.APP_URL || 'https://stock-control-room.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLOT: ${{ inputs.slot }}
        run: |
          if [ -z "$SLOT" ]; then
            hour=$(TZ=Africa/Johannesburg date +%H)
            case "$hour" in
              10|11) SLOT=10 ;;
              15|16) SLOT=15 ;;
              18|19) SLOT=18 ;;
              *) echo "No report is due at ${hour}:xx South African time"; exit 0 ;;
            esac
          fi
          echo "Asking for the ${SLOT}:00 report at $(TZ=Africa/Johannesburg date '+%H:%M:%S') South African time"
          auth=()
          if [ -n "$CRON_SECRET" ]; then auth=(-H "Authorization: Bearer $CRON_SECRET"); fi
          curl --fail-with-body --silent --show-error --max-time 60 "${auth[@]}" \
            "$APP_URL/api/cron/report/$SLOT?source=github"
          echo
